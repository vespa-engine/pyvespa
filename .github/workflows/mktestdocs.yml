name: MKDocs test and linkcheck

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
jobs:
  mk-docs-test:
    runs-on: ubuntu-latest
    steps:
      - name: Install pandoc
        run: |
          sudo apt-get install -y pandoc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.6.16"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra docs
      - name: Run tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run pytest tests/mktestdocs -s -v
      - name: Build docs
        run: |
          uv run mkdocs build --site-dir docs/sphinx/build
      - name: Run linkcheck
        run: |
          uv run .github/scripts/linkcheck.py --ignore-url-file .github/scripts/ignore_urls.txt docs/sphinx/source/
